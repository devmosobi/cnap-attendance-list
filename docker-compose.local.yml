# Surcharge pour tester toute la stack sur Docker Desktop :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Application : http://localhost:3000  ·  Emails capturés par Mailpit : http://localhost:8025

services:
  # PostgreSQL de test, uniquement pour Docker Desktop (en production, le serveur est externe).
  # Dans .env : POSTGRES_HOST=db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      Jwt__CookieSecure: "false"
      Smtp__Hote: mailpit
      Smtp__Port: "1025"
      Smtp__UtiliserTls: "false"
      Smtp__ExpediteurEmail: formation@rotary-district9101.org

  frontend:
    ports:
      - "3000:3000"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  pgdata-local:
