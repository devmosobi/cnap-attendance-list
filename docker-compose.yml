# Gestion Liste de Présence – Commission Nationale Apprentissage
# Production (Dockploy) : aucun port publié. Les domaines se déclarent dans Dockploy (onglet Domains)
# sur le service « frontend », port 3000 ; Next.js relaie /api vers le backend en interne.
# Base de données : serveur PostgreSQL externe (variables POSTGRES_*).
# Test local : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

name: cnap-attendance

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Serveur PostgreSQL externe.
      ConnectionStrings__Default: Host=${POSTGRES_HOST:?POSTGRES_HOST est requis};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:?POSTGRES_DB est requis};Username=${POSTGRES_USER:?POSTGRES_USER est requis};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis};SSL Mode=${POSTGRES_SSL_MODE:-Prefer}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET est requis (32 caractères minimum)}
      Jwt__CookieSecure: ${COOKIE_SECURE:-true}
      Cors__Origines: ${PUBLIC_URLS:-}
      Database__MigrateOnStartup: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminMotDePasse: ${ADMIN_PASSWORD:-}
      Seed__ReinitialiserAdmin: ${ADMIN_RESET:-false}
      Seed__DonneesDemo: ${SEED_DONNEES_DEMO:-true}
      RateLimiting__PublicParMinute: ${RATE_LIMIT_PUBLIC_PAR_MINUTE:-300}
      Smtp__Hote: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Utilisateur: ${SMTP_USER:-}
      Smtp__MotDePasse: ${SMTP_PASSWORD:-}
      Smtp__ExpediteurEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__ExpediteurNom: ${SMTP_FROM_NAME:-Commission Nationale Apprentissage}
      Smtp__UtiliserTls: ${SMTP_TLS:-true}

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
